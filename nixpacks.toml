[providers]
providers = ['node']

[phases.setup]
nixPkgs = ['pnpm']

[phases.install]
cmds = ['pnpm install --frozen-lockfile --ignore-scripts']

[phases.build]
cmds = ['pnpm --filter @workspace/opportunity-tracker run build']

[start]
cmd = 'npx -y serve -s artifacts/opportunity-tracker/dist -l $PORT'
